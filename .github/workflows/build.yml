name: Build and Deploy APT Repository

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

# One build at a time: a new push cancels superseded runs so only the
# latest commit gets built and deployed.
concurrency:
  group: apt-repo-build
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so build-deb.sh can derive stable mtimes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # --- Resolve upstream versions for every package ---
      # Queries each package's source (npm/PyPI/GitHub releases/Meta's
      # channel manifest) for its latest version and exports env vars the
      # build steps consume, so every CI run tracks the newest release
      # instead of the versions pinned in the package definitions.
      - name: Resolve upstream versions
        run: bash scripts/resolve-versions.sh "$GITHUB_ENV"

      # Compare resolved upstream versions with the versions in the published
      # repository. A weekly run with no upstream changes stops here.
      - name: Check for upstream version changes
        id: version-check
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          python3 - <<'PY'
          import os
          import subprocess

          package_env = {
              "curl-cffi": "CURL_CFFI_VERSION",
              "muse-code": "MUSE_PKGVER",
              "opencode": "OPENCODE_VERSION",
              "antigravity-cli": "AGY_VERSION",
              "oh-my-pi": "OMP_VERSION",
              "copilot-cli": "COPILOT_CLI_VERSION",
          }
          expected = {}
          for package, env_key in package_env.items():
              resolved = (os.environ.get(env_key) or "").strip()
              expected[package] = f"{resolved}-1" if resolved else ""

          try:
              packages = subprocess.check_output(
                  ["git", "show", "origin/gh-pages:dists/stable/main/binary-aarch64/Packages"],
                  text=True,
              )
          except subprocess.CalledProcessError:
              packages = ""

          metadata_available = bool(packages.strip())
          current = {}
          for stanza in packages.split("\n\n"):
              fields = dict(
                  line.split(": ", 1)
                  for line in stanza.splitlines()
                  if ": " in line
              )
              if "Package" in fields and "Version" in fields:
                  current[fields["Package"]] = fields["Version"]

          package_changes = {}
          for package, version in expected.items():
              if not metadata_available:
                  package_changes[package] = True
              elif not version:
                  package_changes[package] = True
              else:
                  package_changes[package] = current.get(package) != version

          changed = any(package_changes.values())
          print("Published versions:", current or "(none)")
          print("Resolved versions:", expected)
          print("Per-package rebuild flags:", package_changes)
          print(f"Version changes detected: {changed}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"build={'true' if changed else 'false'}\n")
              for package, should_build in package_changes.items():
                  output_name = f"build_{package.replace('-', '_')}"
                  output.write(f"{output_name}={'true' if should_build else 'false'}\n")
          PY

      - name: Skip build when versions are unchanged
        if: steps.version-check.outputs.build == 'false'
        run: echo "All published packages already match the latest upstream versions."

      - name: Install dependencies
        if: steps.version-check.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gcc-aarch64-linux-gnu upx-ucl git perl python3 pkg-config

      - name: Create output directory
        if: steps.version-check.outputs.build == 'true'
        run: mkdir -p debs

      # The published repository is the source of truth for every package
      # that was not rebuilt in this run. Builds are gated per package on the
      # upstream version, so a run that only rebuilds two packages would
      # otherwise regenerate the repository from those two packages alone and
      # the deploy would drop the rest from the published repo.
      - name: Restore previously published packages
        if: steps.version-check.outputs.build == 'true'
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git archive origin/gh-pages dists 2>/dev/null | tar -x 2>/dev/null || true
            git archive origin/gh-pages pool 2>/dev/null | tar -x 2>/dev/null || true
          fi

          # Drop published packages that are no longer part of this
          # repository, so carrying the published state over cannot
          # resurrect a package that was intentionally removed. The prune is
          # skipped when no package definitions are found, so a broken
          # checkout can never wipe the published repository.
          known_count=0
          if [ -d packages ]; then
            known_count=$(find packages -mindepth 1 -maxdepth 1 -type d | wc -l)
          fi
          if [ "$known_count" -eq 0 ]; then
            echo "No package definitions found; skipping the prune."
          else
            for deb in pool/main/*.deb dists/stable/main/binary-*/*.deb; do
              [ -f "$deb" ] || continue
              pkg=$(dpkg-deb -f "$deb" Package)
              if [ ! -d "packages/${pkg}" ]; then
                echo "Pruning published package no longer in this repository: ${pkg}"
                rm -f "$deb"
              fi
            done
          fi

      # --- curl-cffi (pip wrapper, arch detected at install time) ---
      - name: Build curl-cffi
        if: steps.version-check.outputs.build_curl_cffi == 'true'
        run: bash scripts/build-deb.sh packages/curl-cffi debs/

      # --- muse-code ---
      - name: Build muse-code (aarch64)
        if: steps.version-check.outputs.build_muse_code == 'true'
        run: bash packages/muse-code/build.sh

      # --- opencode (glibc) ---
      - name: Build opencode (aarch64)
        if: steps.version-check.outputs.build_opencode == 'true'
        run: bash packages/opencode/build.sh

      # --- antigravity-cli (glibc) ---
      - name: Build antigravity-cli (aarch64)
        if: steps.version-check.outputs.build_antigravity_cli == 'true'
        run: bash packages/antigravity-cli/build.sh

      # --- oh-my-pi (glibc) ---
      - name: Build oh-my-pi (aarch64)
        if: steps.version-check.outputs.build_oh_my_pi == 'true'
        run: bash packages/oh-my-pi/build.sh

      # --- copilot-cli (glibc wrapper) ---
      - name: Build copilot-cli (aarch64)
        if: steps.version-check.outputs.build_copilot_cli == 'true'
        run: bash packages/copilot-cli/build.sh

      - name: Compress large debs with upx if needed
        if: steps.version-check.outputs.build == 'true'
        run: |
          for deb in debs/*.deb; do
            size=$(stat -c%s "$deb")
            if [ "$size" -gt 95000000 ]; then
              echo "Compressing $(basename $deb) ($(( size / 1048576 ))MB) with upx..."
              tmpdir=$(mktemp -d)
              dpkg-deb -x "$deb" "$tmpdir"
              find "$tmpdir" -type f -executable | while read bin; do
                if file "$bin" | grep -q "ELF"; then
                  upx --best --lzma "$bin" 2>/dev/null || true
                fi
              done
              control_dir="$tmpdir/DEBIAN"
              mkdir -p "$control_dir"
              dpkg-deb -e "$deb" "$control_dir"
              dpkg-deb -Zxz --build --root-owner-group "$tmpdir" "$deb"
              new_size=$(stat -c%s "$deb")
              echo "  Reduced to $(( new_size / 1048576 ))MB"
              rm -rf "$tmpdir"
            fi
          done

      - name: List built packages
        if: steps.version-check.outputs.build == 'true'
        run: ls -lh debs/

      - name: Generate APT repository
        if: steps.version-check.outputs.build == 'true'
        run: bash scripts/generate-repo.sh

      - name: Generate landing page
        if: steps.version-check.outputs.build == 'true'
        run: bash scripts/generate-index.sh

      - name: Deploy to gh-pages
        if: steps.version-check.outputs.build == 'true'
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Collect everything that should be published.
          mkdir -p /tmp/deploy
          cp install.sh uninstall.sh /tmp/deploy/
          cp -r dists pool /tmp/deploy/
          # Landing page (generated from the Packages files) and the guides.
          cp site/index.html /tmp/deploy/
          cp README.md DNS_FORWARDING.md PACKAGE_RESEARCH.md /tmp/deploy/ 2>/dev/null || true
          touch /tmp/deploy/.nojekyll

          # Start from the published branch with a clean worktree. The
          # published tree is replaced wholesale by /tmp/deploy below, so
          # nothing that is not in /tmp/deploy survives the deploy.
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git reset --hard HEAD
          git clean -fdx
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi
          git rm -rf . 2>/dev/null || true
          git clean -fdx

          cp -r /tmp/deploy/. .

          # -f: the .deb files in pool/ are ignored by the main branch's
          # .gitignore, but they have to be published.
          git add -A -f .
          git commit -m "Deploy $(date -u +%Y-%m-%d)" || true
          git push origin gh-pages

          echo "gh-pages deploy complete!"
