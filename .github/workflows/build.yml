name: Build and Deploy APT Repository

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

# One build at a time: a new push cancels superseded runs so only the
# latest commit gets built and deployed.
concurrency:
  group: apt-repo-build
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so build-deb.sh can derive stable mtimes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve upstream versions
        run: bash scripts/resolve-versions.sh "$GITHUB_ENV"

      - name: Check for upstream version changes
        id: version-check
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          python3 - <<'PY'
          import os
          import subprocess

          package_env = {
              "curl-cffi": "CURL_CFFI_VERSION",
              "muse-code": "MUSE_PKGVER",
              "opencode": "OPENCODE_VERSION",
              "antigravity-cli": "AGY_VERSION",
              "oh-my-pi": "OMP_VERSION",
              "copilot-cli": "COPILOT_CLI_VERSION",
              "kilo-code": "KILO_VERSION",
              "agentty": "AGENTTY_VERSION",
          }
          expected = {}
          for package, env_key in package_env.items():
              resolved = (os.environ.get(env_key) or "").strip()
              expected[package] = f"{resolved}-1" if resolved else ""

          try:
              packages = subprocess.check_output(
                  ["git", "show", "origin/gh-pages:dists/stable/main/binary-aarch64/Packages"],
                  text=True,
              )
          except subprocess.CalledProcessError:
              packages = ""

          metadata_available = bool(packages.strip())
          current = {}
          for stanza in packages.split("\n\n"):
              fields = dict(
                  line.split(": ", 1)
                  for line in stanza.splitlines()
                  if ": " in line
              )
              if "Package" in fields and "Version" in fields:
                  current[fields["Package"]] = fields["Version"]

          package_changes = {}
          for package, version in expected.items():
              if not metadata_available:
                  package_changes[package] = True
              elif not version:
                  package_changes[package] = True
              else:
                  package_changes[package] = current.get(package) != version

          changed = any(package_changes.values())
          print("Published versions:", current or "(none)")
          print("Resolved versions:", expected)
          print("Per-package rebuild flags:", package_changes)
          print(f"Version changes detected: {changed}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"build={'true' if changed else 'false'}\n")
              for package, should_build in package_changes.items():
                  output_name = f"build_{package.replace('-', '_')}"
                  output.write(f"{output_name}={'true' if should_build else 'false'}\n")
          PY

      - name: Skip build when versions are unchanged
        if: steps.version-check.outputs.build == 'false'
        run: echo "All published packages already match the latest upstream versions."

      - name: Install dependencies
        if: steps.version-check.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gcc-aarch64-linux-gnu upx-ucl git perl python3 pkg-config cmake ninja-build ccache

      - name: Create output directory
        if: steps.version-check.outputs.build == 'true'
        run: mkdir -p debs

      - name: Restore previously published packages
        if: steps.version-check.outputs.build == 'true'
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git archive origin/gh-pages dists 2>/dev/null | tar -x 2>/dev/null || true
            git archive origin/gh-pages pool 2>/dev/null | tar -x 2>/dev/null || true
          fi

      # --- curl-cffi ---
      - name: Build curl-cffi
        if: steps.version-check.outputs.build_curl_cffi == 'true'
        run: bash scripts/build-deb.sh packages/curl-cffi debs/

      # --- kilo-code ---
      - name: Build kilo-code (aarch64)
        if: steps.version-check.outputs.build_kilo_code == 'true'
        run: bash packages/kilo-code/build.sh

      # --- agentty: NDK cross-compile ---
      - name: Read agentty version
        if: steps.version-check.outputs.build_agentty == 'true'
        run: echo "AGENTTY_VERSION=$(cat packages/agentty/VERSION)" >> "$GITHUB_ENV"

      - name: Set up NDK r30
        if: steps.version-check.outputs.build_agentty == 'true'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30

      - name: Checkout agentty sources
        if: steps.version-check.outputs.build_agentty == 'true'
        uses: actions/checkout@v4
        with:
          repository: 1ay1/agentty
          ref: v${{ env.AGENTTY_VERSION }}
          submodules: recursive
          path: agentty-src

      - name: Apply Android patches
        if: steps.version-check.outputs.build_agentty == 'true'
        run: |
          git -C agentty-src/third_party/maya/third_party/jaal apply "$GITHUB_WORKSPACE/packages/agentty/android-epoll.patch"
          git -C agentty-src/third_party/claybin apply "$GITHUB_WORKSPACE/packages/agentty/android-claybin.patch"

      - name: Build OpenSSL + nghttp2 for Android
        if: steps.version-check.outputs.build_agentty == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
            bash packages/agentty/build-deps-android.sh arm64-v8a "$GITHUB_WORKSPACE/agentty-deps/arm64-v8a"

      - name: Configure and build agentty
        if: steps.version-check.outputs.build_agentty == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          DEP="$GITHUB_WORKSPACE/agentty-deps/arm64-v8a"
          export PKG_CONFIG_PATH="$DEP/lib/pkgconfig"
          cmake -S agentty-src -B agentty-build-arm64-v8a -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$DEP" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$DEP/lib" \
            -DOPENSSL_ROOT_DIR="$DEP" \
            -DOPENSSL_SSL_LIBRARY="$DEP/lib/libssl.so" \
            -DOPENSSL_CRYPTO_LIBRARY="$DEP/lib/libcrypto.so" \
            -DOPENSSL_INCLUDE_DIR="$DEP/include" \
            -DAGENTTY_AUTO_PULL_MAYA=OFF -DAGENTTY_STANDALONE=OFF -DAGENTTY_BUILD_TESTS=OFF \
            -DMAYA_NATIVE_TUNING=OFF
          cmake --build agentty-build-arm64-v8a --target agentty -j"$(nproc)"

      - name: Build agentty (aarch64)
        if: steps.version-check.outputs.build_agentty == 'true'
        run: AGENTTY_BIN="$GITHUB_WORKSPACE/agentty-build-arm64-v8a/agentty" bash packages/agentty/build.sh aarch64

      - name: Compress large debs with upx if needed
        if: steps.version-check.outputs.build == 'true'
        run: |
          for deb in debs/*.deb; do
            size=$(stat -c%s "$deb")
            if [ "$size" -gt 95000000 ]; then
              echo "Compressing $(basename $deb) ($(( size / 1048576 ))MB) with upx..."
              tmpdir=$(mktemp -d)
              dpkg-deb -x "$deb" "$tmpdir"
              find "$tmpdir" -type f -executable | while read bin; do
                if file "$bin" | grep -q "ELF"; then
                  upx --best --lzma "$bin" 2>/dev/null || true
                fi
              done
              control_dir="$tmpdir/DEBIAN"
              mkdir -p "$control_dir"
              dpkg-deb -e "$deb" "$control_dir"
              dpkg-deb -Zxz --build --root-owner-group "$tmpdir" "$deb"
              new_size=$(stat -c%s "$deb")
              echo "  Reduced to $(( new_size / 1048576 ))MB"
              rm -rf "$tmpdir"
            fi
          done

      - name: List built packages
        if: steps.version-check.outputs.build == 'true'
        run: ls -lh debs/

      - name: Generate APT repository
        if: steps.version-check.outputs.build == 'true'
        run: bash scripts/generate-repo.sh

      - name: Deploy to gh-pages
        if: steps.version-check.outputs.build == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/deploy
          cp install.sh uninstall.sh /tmp/deploy/
          cp -r dists pool /tmp/deploy/
          touch /tmp/deploy/.nojekyll
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git reset --hard HEAD
          git clean -fdx
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi
          git rm -rf . 2>/dev/null || true
          git clean -fdx
          cp -r /tmp/deploy/. .
          git add -A -f .
          git commit -m "Deploy $(date -u +%Y-%m-%d)" || true
          git push origin gh-pages
          echo "gh-pages deploy complete!"
